name: CI
on:
  pull_request:
  push:
    branches: [main]

# Superseded PR runs are cancelled. Runs on main are not: each one pushes
# the image for its commit, and cancelling it would leave that commit
# without an image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: annakonn200059/job-tracker-ci/.github/workflows/go.yml@main
    with:
      go-version: "1.26.7"

  # Fails on an invalid api/openapi.yaml. Whether the handlers match it is
  # checked by the Go contract tests in the ci job above.
  openapi-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@2.58.1 lint api/openapi.yaml

  # Builds and scans the image on every run; the shared workflow pushes it
  # to GHCR only on pushes to main.
  image:
    needs: [ci, openapi-lint]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: annakonn200059/job-tracker-ci/.github/workflows/image.yml@main
    with:
      image-name: job-tracker-api
      trivyignores: .trivyignore
